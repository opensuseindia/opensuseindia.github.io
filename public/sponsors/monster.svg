<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <filter id="clawGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#48d800" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Iconic 3-Claw 'M' Mark -->
  <g id="claw-mark" filter="url(#clawGlow)">
    <!-- Left Claw Scratch -->
    <path d="M 28,12 
             C 27,15 25,23 26,27 
             L 28,32 
             C 26,38 23,49 24,56 
             L 26,62 
             C 24,67 21,78 23,86 
             C 24,88 26,89 27,87 
             C 29,83 31,76 31,71 
             L 30,65 
             C 32,59 34,48 33,42 
             L 31,37 
             C 33,31 35,21 34,14 
             C 33,11 29,10 28,12 Z" 
          fill="#48d800" stroke="#36a300" stroke-width="0.8"/>

    <!-- Middle Claw Scratch (Taller & Central) -->
    <path d="M 44,6 
             C 43,10 40,21 42,27 
             L 45,34 
             C 42,42 39,56 41,64 
             L 44,72 
             C 42,79 38,91 40,96 
             C 41,98 44,97 45,94 
             C 48,87 50,78 49,71 
             L 47,63 
             C 49,55 52,42 50,34 
             L 48,27 
             C 50,19 53,10 51,7 
             C 50,5 45,4 44,6 Z" 
          fill="#48d800" stroke="#36a300" stroke-width="0.8"/>

    <!-- Right Claw Scratch -->
    <path d="M 62,14 
             C 61,18 58,26 60,31 
             L 63,38 
             C 60,46 56,58 58,65 
             L 61,72 
             C 59,77 56,86 58,90 
             C 59,92 62,91 63,88 
             C 66,82 68,74 67,67 
             L 65,61 
             C 67,53 70,42 68,35 
             L 66,28 
             C 68,22 71,15 69,12 
             C 67,10 63,12 62,14 Z" 
          fill="#48d800" stroke="#36a300" stroke-width="0.8"/>
  </g>

  <!-- Typography: MONSTER ENERGY -->
  <g id="typography">
    <!-- MONSTER wordmark with distinct aggressive stylized gothic cuts -->
    <text x="88" y="56" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="2.5" 
          fill="#0c110d">
      MONSTER
    </text>

    <!-- ENERGY subline -->
    <text x="91" y="80" 
          font-family="'Space Grotesk', 'Arial', sans-serif" 
          font-size="14.5" 
          font-weight="800" 
          letter-spacing="9" 
          fill="#48d800">
      ENERGY
    </text>
  </g>
</svg>
